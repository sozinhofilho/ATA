# Integração contínua: valida catálogo, testes unitários, build e testes no navegador a cada envio.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Instalar Playwright (somente no CI)
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: CAPTURAS=0 npm run test:e2e
      - run: npm run test:integracao
